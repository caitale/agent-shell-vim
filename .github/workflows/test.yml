name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        vim-version: ['9.1', '9.2']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vim
        uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.vim-version }}
      - name: Setup python (mock agent)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run headless tests
        run: ./t/run.sh
